<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whale Shark Schooling Field</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main id="playground" aria-label="Whale shark schooling simulation">

    <div id="oceanBackground" aria-hidden="true"></div>

    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <div id="whaleshark" aria-label="Whale shark">
      <div id="sharkShadow" class="shark-shadow" aria-hidden="true"></div>

      <div id="sharkMotion" class="shark-motion">
        <img class="shark-part headbody" src="assets/1_headbody.png" alt="" draggable="false">
        <img class="shark-part lowerbody" src="assets/2_lowerbody.png" alt="" draggable="false">
        <img class="shark-part leftfin" src="assets/3_leftfin.png" alt="" draggable="false">
        <img class="shark-part rightfin" src="assets/4_rightfin.png" alt="" draggable="false">
        <img class="shark-part tailfin" src="assets/5_tailfin.png" alt="" draggable="false">
        <img class="shark-part dorsal-a" src="assets/6_dorsalA.png" alt="" draggable="false">
        <img class="shark-part dorsal-b" src="assets/7_dorsalB.png" alt="" draggable="false">
      </div>
    </div>

    <div id="glideControl" class="glide-control" aria-label="Glide control">
      <div class="glide-label">GLIDE</div>

      <button
        id="glideToggle"
        class="glide-toggle is-on"
        type="button"
        aria-pressed="true"
        aria-label="Toggle glide mode"
      >
        <span class="glide-option glide-on">ON</span>
        <span class="glide-option glide-off">OFF</span>
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>

</html>
